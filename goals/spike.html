<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF round-trip spike</title><body><h1>PDF round-trip</h1><p>Кириллица, emoji, 64 действия и длинный текст. Файл обрабатывается локально.</p><button id="make">Создать тестовый PDF</button><a id="download" hidden download="цели_deep_searching.pdf">Скачать PDF</a><label>Загрузить тот же PDF<input id="file" type="file" accept="application/pdf,.pdf"></label><pre id="result"></pre><script type="module">
import {PDFDocument} from './vendor/pdf-lib.js';import {embedState} from './pdf/embedState.js';import {extractState} from './pdf/extractState.js';
const sample={format:'deep-searching-goals',schemaVersion:1,id:'spike',createdAt:'2026-09-18T00:00:00.000Z',updatedAt:'2026-09-18T00:00:00.000Z',onboardingState:'COMPLETE',goal:{text:'Цель 🎯 中文 café',purpose:'Длинный текст '.repeat(70)},pillars:Array.from({length:8},(_,i)=>({id:`p${i}`,position:i,text:`Направление ${i}`,actions:Array.from({length:8},(_,j)=>({id:`a${i}-${j}`,position:j,text:'Действие 👩🏽‍💻 '.repeat(15),type:'idea'}))})),priorityActionIds:[]};
window.sample=sample;
make.onclick=async()=>{const pdf=await PDFDocument.create();pdf.addPage().drawText('Open Window 64: PDF round-trip');await embedState(pdf,sample);const bytes=await pdf.save();const restored=await extractState(bytes);result.textContent=JSON.stringify(restored.data)===JSON.stringify(sample)?'In-memory PASS':'FAIL';download.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));download.hidden=false;};
file.onchange=async()=>{try{const restored=await extractState(await file.files[0].arrayBuffer());result.textContent=JSON.stringify(restored.data)===JSON.stringify(sample)?'File round-trip PASS':'FAIL';}catch(e){result.textContent=e.message;}};
</script></body></html>
